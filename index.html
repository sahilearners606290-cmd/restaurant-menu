<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Menu</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

h1{
text-align:center;
color:#ff6600;
}

.menu-item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #ddd;
}
</style>

</head>
<body>

<div class="container">
<h1>ABC Restaurant</h1>

<h2>Pizza</h2>

<div class="menu-item">
<span>Garlic Pizza</span>
<span>₹220</span>
</div>

<div class="menu-item">
<span>Cheese Pizza</span>
<span>₹260</span>
</div>

<h2>Burgers</h2>

<div class="menu-item">
<span>Veg Burger</span>
<span>₹55</span>
</div>

<div class="menu-item">
<span>Cheese Burger</span>
<span>₹80</span>
</div>

<h2>Kopta</h2>

<div class="menu-item">
<span>Veg Kopta </span>
<span>₹200</span>
</div>

<div class="menu-item">
<span>Malai Kopta</span>
<span>₹260</span>
</div>

<h2>Dal</h2>

<div class="menu-item">
<span>Dal Fried</span>
<span>₹120</span>
</div>

<div class="menu-item">
<span>Dal Jira</span>
<span>₹100</span>
</div>

<h2>Rice</h2>

<div class="menu-item">
<span>Plain Rice</span>

</div>

<div class="menu-item">
<span>Jira Rice</span>
<span>₹120</span>
</div>

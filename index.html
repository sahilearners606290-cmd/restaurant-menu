<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shyam Bog Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#ffecd2,#fcb69f);margin:0;padding:20px}
.container{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
h1{text-align:center;color:#ff6600}
h2{background:#ff6600;color:#fff;padding:10px;border-radius:10px}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.controls{display:flex;align-items:center;gap:10px}
.btn{width:32px;height:32px;border:none;border-radius:50%;background:#25D366;color:#fff;font-size:18px;cursor:pointer}
.qty{min-width:20px;text-align:center;font-weight:bold}
.total{text-align:center;font-size:22px;font-weight:bold;margin-top:20px}
.order-btn{width:100%;padding:14px;background:#25D366;color:white;border:none;border-radius:10px;font-size:18px;margin-top:20px;cursor:pointer}
.floatwa{position:fixed;bottom:20px;right:20px;background:#25D366;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;font-size:30px}
#searchBox{
width:100%;
padding:12px;
margin:15px 0;
border:2px solid #ff6600;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}
</style>
</head>
<body>
<div class="container">
<h1>🍽️ Shyam Bog</h1>
<p style="text-align:center">Pure Veg Restaurant<br>📞 9555484389</p>

<input type="text" id="tableNo" placeholder="Enter Table Number">
<input type="text" id="searchBox" placeholder="🔍 Search Food Item..." onkeyup="searchFood()">

<h2>Pizza</h2>
<div class="menu-item"><span>🔥 Garlic Pizza - ₹220</span><div class="controls"><button class="btn" onclick="removeItem('Garlic Pizza')">-</button><span id="Garlic Pizza" class="qty">0</span><button class="btn" onclick="addItem('Garlic Pizza')">+</button></div></div>
<div class="menu-item"><span>Cheese Pizza - ₹260</span><div class="controls"><button class="btn" onclick="removeItem('Cheese Pizza')">-</button><span id="Cheese Pizza" class="qty">0</span><button class="btn" onclick="addItem('Cheese Pizza')">+</button></div></div>

<h2>Burgers</h2>
<div class="menu-item"><span>Veg Burger - ₹55</span><div class="controls"><button class="btn" onclick="removeItem('Veg Burger')">-</button><span id="Veg Burger" class="qty">0</span><button class="btn" onclick="addItem('Veg Burger')">+</button></div></div>
<div class="menu-item"><span>Cheese Burger - ₹80</span><div class="controls"><button class="btn" onclick="removeItem('Cheese Burger')">-</button><span id="Cheese Burger" class="qty">0</span><button class="btn" onclick="addItem('Cheese Burger')">+</button></div></div>

<h2>Kopta</h2>
<div class="menu-item"><span>Veg Kopta - ₹200</span><div class="controls"><button class="btn" onclick="removeItem('Veg Kopta')">-</button><span id="Veg Kopta" class="qty">0</span><button class="btn" onclick="addItem('Veg Kopta')">+</button></div></div>
<div class="menu-item"><span>Malai Kopta - ₹260</span><div class="controls"><button class="btn" onclick="removeItem('Malai Kopta')">-</button><span id="Malai Kopta" class="qty">0</span><button class="btn" onclick="addItem('Malai Kopta')">+</button></div></div>

<h2>Dal</h2>
<div class="menu-item"><span>Dal Fried - ₹120</span><div class="controls"><button class="btn" onclick="removeItem('Dal Fried')">-</button><span id="Dal Fried" class="qty">0</span><button class="btn" onclick="addItem('Dal Fried')">+</button></div></div>
<div class="menu-item"><span>Dal Jira - ₹100</span><div class="controls"><button class="btn" onclick="removeItem('Dal Jira')">-</button><span id="Dal Jira" class="qty">0</span><button class="btn" onclick="addItem('Dal Jira')">+</button></div></div>

<h2>Rice</h2>
<div class="menu-item"><span>Plain Rice - ₹90</span><div class="controls"><button class="btn" onclick="removeItem('Plain Rice')">-</button><span id="Plain Rice" class="qty">0</span><button class="btn" onclick="addItem('Plain Rice')">+</button></div></div>
<div class="menu-item"><span>Jira Rice - ₹120</span><div class="controls"><button class="btn" onclick="removeItem('Jira Rice')">-</button><span id="Jira Rice" class="qty">0</span><button class="btn" onclick="addItem('Jira Rice')">+</button></div></div>

<div class="total">Total: <span id="totalBill">₹0</span></div>
<button class="order-btn" onclick="sendOrder()">Order on WhatsApp</button>
</div>

<a class="floatwa" href="#" onclick="sendOrder(); return false;">💬</a>

<script>
let cart={};
const prices={"Garlic Pizza":220,"Cheese Pizza":260,"Veg Burger":55,"Cheese Burger":80,"Veg Kopta":200,"Malai Kopta":260,"Dal Fried":120,"Dal Jira":100,"Plain Rice":90,"Jira Rice":120};

function addItem(item){
    cart[item]=(cart[item]||0)+1;
    document.getElementById(item).innerText=cart[item];
    updateTotal();
}

function removeItem(item){
    if(cart[item]>0){
        cart[item]--;
        document.getElementById(item).innerText=cart[item];
        updateTotal();
    }
}

function updateTotal(){
    let total=0;
    for(let i in cart){
        total+=cart[i]*prices[i];
    }
    document.getElementById('totalBill').innerText='₹'+total;
}

function searchFood(){
    let input = document.getElementById("searchBox").value.toLowerCase();
    let items = document.getElementsByClassName("menu-item");
    for(let i=0;i<items.length;i++){
        let text = items[i].innerText.toLowerCase();
        if(text.includes(input)){
            items[i].style.display="flex";
        } else {
            items[i].style.display="none";
        }
    }
}

function sendOrder(){
    let tableNo=document.getElementById('tableNo').value;
    if(!tableNo){
        alert("Please enter Table Number first!");
        return;
    }
    let total=0;
    let hasItems=false;
    let msg='New Order%0ATable Number: '+tableNo+'%0A%0A';
    
    for(let i in cart){
        if(cart[i]>0){
            msg+=i+' x '+cart[i]+'%0A';
            total+=cart[i]*prices[i];
            hasItems=true;
        }
    }
    
    if(!hasItems){
        alert("Please add at least one item to your cart!");
        return;
    }
    
    msg+='%0ATotal Bill: ₹'+total;
    window.open('https://wa.me/919555484389?text='+msg,'_blank');
}
</script>
</body>
</html>

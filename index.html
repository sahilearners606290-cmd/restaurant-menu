<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shyam Bog - Digital Menu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-36">

<header class="bg-orange-500 text-white p-5 sticky top-0 z-50 shadow-md text-center flex flex-col items-center justify-center">
    <!-- 🖼️ Logo Image Box -->
    <img src="logo.png" alt="Shyam Bog Logo" class="w-20 h-20 rounded-full border-2 border-white object-cover shadow-sm mb-2">
    
    <h1 class="text-3xl font-extrabold tracking-wide">Shyam Bog</h1>
    <p class="text-xs opacity-90 mt-1 font-medium">Shudh Evam Swadist Shakahari Bhojan</p>
</header>

    <div class="max-w-md mx-auto px-4 mt-4">
        
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4 space-y-3 border border-gray-100">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Apna Table Number Darj Karein:</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-chair"></i>
                    </span>
                    <input type="number" id="tableNumber" placeholder="Table No. (e.g. 5)" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-lg text-orange-600">
                </div>
            </div>
            
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchBar" oninput="searchFood()" placeholder="Pasandida bhojan khojein (Search)..." class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>
        </div>

        <div id="menuContainer" class="space-y-6"></div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 shadow-2xl p-4 z-50 rounded-t-2xl">
        <div class="flex justify-between items-center mb-3 px-1">
            <div>
                <p class="text-xs text-gray-400 font-medium">Total Bill</p>
                <p class="text-2xl font-black text-gray-800">₹<span id="totalBill">0</span></p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400 font-medium">Chayanit Items</p>
                <p class="text-sm font-bold text-orange-500"><span id="totalItems">0</span> Items Selected</p>
            </div>
        </div>
        
        <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 text-lg transition duration-200">
            <i class="fa-brands fa-whatsapp text-2xl"></i>
            WhatsApp Par Order Bhejein
        </button>
    </div>

    <script>
        // Owner's WhatsApp number (Apna number yaha badlein)
                 // 🟢 Google Sheet CSV Link (Live Connection)
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHyTwOpmmpDJuunmOMAtaKBQ-hMEdMCs3t0EpMAPA_cfHaJfbLvFbZn26M13l9uy2L3IDmPErpSOFF/pub?output=csv";

        // Shuruat me ek default number rakh rahe hain (agar sheet se load na ho paye)
        let WHATSAPP_NUMBER = "919555484389"; 
        let menuData = {};
        let cart = {};

        // Google Sheet se data aur WhatsApp number load karne ka automatic function
        async function fetchMenuFromSheet() {
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                const csvText = await response.text();
                
                const rows = csvText.split("\n");
                const freshMenuData = {};

                // 📞 Pehli line (Row 1) se WhatsApp number nikalna
                if (rows.length > 0) {
                    const firstRowColumns = rows[0].split(",");
                    if (firstRowColumns.length >= 5 && firstRowColumns[4].trim()) {
                        // Agar Column E me koi number likha hai toh use set karein
                        WHATSAPP_NUMBER = firstRowColumns[4].trim().replace(/[^0-9]/g, '');
                    }
                }

                // Pehli line heading hai, isliye i = 1 se items shuru karenge
                for (let i = 1; i < rows.length; i++) {
                    const currentRow = rows[i].trim();
                    if (!currentRow) continue;

                    // Comma se data alag karna
                    const columns = currentRow.split(",");
                    if (columns.length < 3) continue;

                    const category = columns[0].trim();
                    const itemName = columns[1].trim();
                    const price = parseInt(columns[2].trim()) || 0;

                    if (category && itemName) {
                        if (!freshMenuData[category]) {
                            freshMenuData[category] = [];
                        }
                        freshMenuData[category].push({ name: itemName, price: price });
                    }
                }

                // Global variables me fresh data set karna
                menuData = freshMenuData;
                
                // Live data ke sath menu ko screen par dikhana
                renderMenu();

            } catch (error) {
                console.error("Sheet se menu load nahi ho paya:", error);
                alert("Menu load hone me thodi dikkat aa rahi hai, kripya page refresh karein.");
            }
        }
         // Render Application View (Original Design)
        function renderMenu() {
            const container = document.getElementById("menuContainer");
            container.innerHTML = "";

            for (let category in menuData) {
                let categoryHtml = `
                    <div class="category-section bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100 block">
                        <div class="bg-orange-50 px-4 py-3 border-b border-orange-100">
                            <h2 class="text-lg font-bold text-orange-700">${category}</h2>
                        </div>
                        <div class="divide-y divide-gray-100">
                `;

                menuData[category].forEach(item => {
                    const itemId = item.name.replace(/\s+/g, '-');
                    const qty = cart[item.name] ? cart[item.name].qty : 0;

                    categoryHtml += `
                        <div class="food-item flex justify-between items-center p-4 hover:bg-gray-50/50" data-name="${item.name.toLowerCase()}">
                            <div>
                                <h3 class="font-semibold text-gray-900">${item.name}</h3>
                                <p class="text-orange-600 font-bold mt-0.5">₹${item.price}</p>
                            </div>
                            
                            <div class="flex items-center bg-orange-50 border border-orange-200 rounded-xl p-1 shadow-sm">
                                <button onclick="updateQty('${item.name}', ${item.price}, -1)" class="w-8 h-8 rounded-lg bg-white text-orange-600 font-extrabold flex items-center justify-center hover:bg-orange-100 active:scale-95 transition">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                <span id="qty-${itemId}" class="w-9 text-center font-black text-gray-800 text-base">${qty}</span>
                                <button onclick="updateQty('${item.name}', ${item.price}, 1)" class="w-8 h-8 rounded-lg bg-white text-orange-600 font-extrabold flex items-center justify-center hover:bg-orange-100 active:scale-95 transition">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                categoryHtml += `</div></div>`;
                container.innerHTML += categoryHtml;
            }
        }

        // Qty Toggler
        function updateQty(name, price, change) {
            const itemId = name.replace(/\s+/g, '-');
            if (!cart[name]) cart[name] = { price: price, qty: 0 };
            cart[name].qty += change;

            if (cart[name].qty <= 0) {
                delete cart[name];
                document.getElementById(`qty-${itemId}`).innerText = 0;
            } else {
                document.getElementById(`qty-${itemId}`).innerText = cart[name].qty;
            }
            calculateTotal();
        }

        // Realtime Calculator
        function calculateTotal() {
            let totalBill = 0, totalItems = 0;
            for (let key in cart) {
                totalBill += cart[key].price * cart[key].qty;
                totalItems += cart[key].qty;
            }
            document.getElementById("totalBill").innerText = totalBill;
            document.getElementById("totalItems").innerText = totalItems;
        }

        // Search Filter Engine
        function searchFood() {
            let input = document.getElementById('searchBar').value.toLowerCase().trim();
            let foodItems = document.getElementsByClassName('food-item');
            let sections = document.getElementsByClassName('category-section');

            for (let i = 0; i < foodItems.length; i++) {
                let name = foodItems[i].getAttribute('data-name');
                if (input === "" || name.includes(input)) {
                    foodItems[i].style.setProperty('display', 'flex', 'important');
                } else {
                    foodItems[i].style.setProperty('display', 'none', 'important');
                }
            }

            for (let j = 0; j < sections.length; j++) {
                let itemsInside = sections[j].getElementsByClassName('food-item');
                let hasVisibleItem = false;
                for (let k = 0; k < itemsInside.length; k++) {
                    if (itemsInside[k].style.display !== "none") {
                        hasVisibleItem = true;
                        break;
                    }
                }
                sections[j].style.setProperty('display', hasVisibleItem ? 'block' : 'none', 'important');
            }
        }

        // Checkout Manager (WhatsApp Send)
        function sendWhatsAppOrder() {
            const tableNum = document.getElementById("tableNumber").value.trim();
            if (!tableNum) { alert("Kripya pehle apna table number darj karein! 🪑"); return; }
            if (Object.keys(cart).length === 0) { alert("Kripya order karne ke liye kam se kam ek item chunein! 🛒"); return; }

            let message = `*--- 🍽️ New Order (SHYAM BOG) ---*\n\n*🪑 Table Number:* ${tableNum}\n-----------------------------\n`;
            let grandTotal = 0;
            for (let key in cart) {
                let itemTotal = cart[key].price * cart[key].qty;
                grandTotal += itemTotal;
                message += `▪️ ${key} x ${cart[key].qty} = *₹${itemTotal}*\n`;
            }
            message += `-----------------------------\n*💰 Grand Total:* ₹${grandTotal}\n\nKripya hamara order jaldi taiyar karein. Dhanyawad! 🙏`;
            window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(message)}`, '_blank');
        }

        // App khulte hi automatic Sheet se data khinchne ka trigger
        window.onload = function() { 
            fetchMenuFromSheet(); 
        };
    </script>
</body>
</html>
